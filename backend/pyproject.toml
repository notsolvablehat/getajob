[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "appwrite>=23.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[cryptography]>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "PLW0602", "TRY002"]
